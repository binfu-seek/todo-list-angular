<h1>To-Do List</h1>
<div>
    <div>
        <ul class="todo-list">
            @for (todo of todos(); track todo.guid) {
            <li class="todo-item" 
                (mouseenter)="onHover(todo.guid)" 
                (mouseleave)="onLeave()"  
                [ngClass]="{ 'hovered': hoveredTodoGuid === todo.guid }">
                <div class="todo-content">
                    <h3>{{ todo.title }}</h3>
                    <p>{{ todo.description }}</p>
                </div>
                <div class="todo-actions">
                    <button (click)="deleteTodo(todo.guid)">Delete</button>
                </div>
            </li>
            }
        </ul>
    </div>
    <div>
        <form class="todo-form" [formGroup]="todoForm" (ngSubmit)="onSubmit()">
            <input formControlName="title" placeholder="Enter todo title" />
            <input formControlName="description" placeholder="Enter todo description" />
            <button type="submit">Add Todo</button>
        </form>
    </div>
</div>
